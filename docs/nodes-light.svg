dth="190.0" height="62.0" rx="6" class="box"/><text x="615.0" y="204.0" class="t" text-anchor="middle" font-size="13" font-weight="600">motor controller</text><text x="615.0" y="220.0" class="m" text-anchor="middle" font-size="11.5">lgpio pwm · 50 hz</text><text x="615.0" y="234.0" class="m" text-anchor="middle" font-size="11.5">0.5 s watchdog</text><rect x="730.0" y="182.0" width="100.0" height="50.0" rx="6" class="box"/><text x="780.0" y="211.5" class="t" text-anchor="middle" font-size="13" font-weight="600">esc + servo</text><path d="M190.0,45.0 L222.0,45.0 L222.0,62.0 L248.0,62.0" class="ln" marker-end="url(#ar)"/><path d="M190.0,115.0 L222.0,115.0 L222.0,94.0 L248.0,94.0" class="ln" marker-end="url(#ar)"/><path d="M190.0,207.0 L248.0,207.0" class="ln" marker-end="url(#ar)"/><path d="M345.0,176.0 L345.0,120.0" class="al" marker-end="url(#ara)"/><text x="353.0" y="152.0" class="a" text-anchor="start" font-size="11.5">loop closure</text><path d="M440.0,76.0 L518.0,76.0" class="ln" marker-end="url(#ar)"/><text x="479.0" y="68.0" class="m" text-anchor="middle" font-size="11">/map, tf</text><path d="M615.0,118.0 L615.0,174.0" class="ln" marker-end="url(#ar)"/><text x="623.0" y="150.0" class="m" text-anchor="start" font-size="11.5">/cmd_vel</text><path d="M710.0,207.0 L728.0,207.0" class="ln" marker-end="url(#ar)"/><text x="10.0" y="280.0" class="m" text-anchor="start" font-size="12">route: start → checkpoint 1 → checkpoint 2 → treasure → finish, with a sound at each tag</text></svg>
