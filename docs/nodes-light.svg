.fill-a{fill:#8250df} .fill-m{fill:#59636e} .fill-f{fill:#8c959f} .fill-fg{fill:#1f2328}
.fill-line{fill:#d0d7de} .fill-panel{fill:#f6f8fa}
.s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .s4{fill:#eda100}
.q1{fill:#d8cbfb} .q2{fill:#ae92f2} .q3{fill:#8250df}
.edge{fill:none;stroke:#8c959f;stroke-width:1;stroke-opacity:.45}
.ring{stroke:#f6f8fa;stroke-width:2}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mk"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mka"/></marker>
<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mkh"/></marker>
