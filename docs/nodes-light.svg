<svg xmlns="http://www.w3.org/2000/svg" width="840" height="296" viewBox="0 0 840 296" role="img"><title>ros2 node graph for the slam rc car</title><style>
svg{font-size:13px} text{font-family:SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;fill:#1f2328}
.t{fill:#1f2328} .m{fill:#59636e} .f{fill:#8c959f} .a{fill:#8250df} .h{fill:#cf222e}
.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.abox{fill:#f4efff;stroke:#c8b5f5;stroke-width:1}
.hbox{fill:#ffebe9;stroke:#cf222e;stroke-width:1}
.obox{fill:none;stroke:#d0d7de;stroke-width:1}
.dash{fill:none;stroke:#d0d7de;stroke-width:1;stroke-dasharray:4 4}
.ln{fill:none;stroke:#59636e;stroke-width:1.5}
.al{fill:none;stroke:#8250df;stroke-width:1.75}
.hl{fill:none;stroke:#cf222e;stroke-width:1.75}
.fl{fill:none;stroke:#8c959f;stroke-width:1}
.gl{fill:none;stroke:#eaeef2;stroke-width:1}
